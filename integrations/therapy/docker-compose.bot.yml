services:
  evolution_postgres:
    image: postgres:16-alpine
    container_name: therapy_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-bot-gateway-db.sh:/docker-entrypoint-initdb.d/init-bot-gateway-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d ${EVOLUTION_POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - therapy_default

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: therapy_evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8085}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8085}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution_postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CONFIG_SESSION_PHONE_CLIENT: "Therapy Bot"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      LOG_LEVEL: ERROR
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution_postgres:
        condition: service_healthy
    networks:
      - therapy_default

  bot-gateway:
    build:
      context: ../../python/therapy-bot-gateway
      dockerfile: ../../integrations/therapy/Dockerfile.bot-gateway
    container_name: therapy_bot_gateway
    restart: unless-stopped
    ports:
      - "${BOT_GATEWAY_PORT:-8090}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution_postgres:5432/bot_gateway
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://host.docker.internal:4096}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-therapy-reception-bot}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD}
      EVOLUTION_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - therapy_default

volumes:
  evolution_postgres_data:
  evolution_instances:

networks:
  therapy_default:
    external: true
